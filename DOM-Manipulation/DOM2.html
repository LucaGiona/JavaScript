<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vorführungen</title>
    <style>
        .black{
            background-color: #000;
            color:#fff;
            width: 100px;
            margin: 100px auto;
            padding:100px;
        }
        .red{
            background-color: #f00;
            color:#0f0;
            width: 100px;
            margin: 100px auto;
            padding:100px;
        }
    </style>
</head>

<body>
<h1>DOM 2</h1>
<input type="text" id="ausgabenID" name="ausgaben" value="" style="width: 1000px;">
<label for="ausgabenID">Ausgaben</label>
<br/><br/>
<input type="button" value="get URL" onclick="getURL()">
<input type="button" value="get FileName" onclick="getFileName()">
<input type="button" value="get Domain" onclick="getDomain()">
<input type="button" value="get Image Info" onclick="getImageInfo()">
<input type="button" value="get Links" onclick="getLinks()">
<input type="range" min="1" max="100" value="50" id="myRange">
<br/><br/>
<img src="../../../_images/site/arrow_up.png" id="arrowImgID"/>
<br/>
<img src="../../../_images/site/quitsche_entchen.jpg" id="entcheImgID">
<br/><br/>
<a href="http://google.de">Google</a>
<br/>
<a href="http://datenmark.de">Datenmark</a>
<br/><br/>
<div class="top">
    <input type="text" id="fname" name="fname" class="textBoxClass" value="">
    <label for="fname">Vorname</label><br/><br/>
    <input type="text" id="lname" name="lname" class="textBoxClass" value="">
    <label for="lname">Nachname</label>
    <p>Name: <span id="output"></span></p>
    <input type="button" value="Namen lesen)" onclick="getName()">
</div>
<br/><br/>
<button id="checkboxId">Alle ankreuzen mit get ByName</button>
<button id="checkboxId2">Alle deaktivieren mit get ByName</button>
<br/><br/>
<div>
    <label> <input type="checkbox" id="KäseID" name="Lecker" value="Käse"> Käse </label>
    <br/>
    <label><input type="checkbox" name="Lecker" value="Tomaten"> Tomaten </label>
    <br/>
    <label><input type="checkbox" name="Lecker" value="Pilze"> Pilze </label>
    <br/>
    <label><input type="checkbox" name="Lecker" value="Oliven"> Oliven </label>
    <br/>
    <label><input type="checkbox" name="Lecker" value="Kuerbiskernbrot"> Kürbiskernbrot </label>
    <br/>
    <label><input type="checkbox" name="Lecker" value="Fisch"> Fisch </label>
</div>
<br/><br/>
<button id="getClassId">get ByClass</button>
<button id="attributeId">get the Attribute</button>
<br/><br/>
<div class="divClass">xxx</div>
<div class="divClass" >yyy</div>
<div class="divClass"
     id="divId"
     datenAttribut="ein div mit zzz als innerHTML"
     attr="noch ein Attribut"
     grmpf="Hallo grmpf grmf"
>hier sind Attribute drinne</div>
<br/><br/>
<button id="cmdImgId">Bild bewegen</button>
<br/><br/>
<input type="button" class="buttonClass" value="Text- und HTML Elemente erzeugen" onclick="createText()">
<input type="button" class="buttonClass" value="neue Liste erstellen" onclick="newList()">
<input type="button" class="buttonClass" value="neues Bild einfügen" onclick="newImage()">
<input type="button" class="buttonClass" value="viele Bilder einfügen" onclick="createImg()">
<input type="button" value="Quitsche Entchen entfernen" onclick="remove('entcheImgID')">
<input type="button" value="Pfeil entfernen" onclick="remove('arrowImgID')">
<br/><br/>
<div id="imageId"></div>
<div id="listDivId" class="divClass" ></div>
<div id="newElementsID"></div>
<div id="targetID"></div>
<h1>set/remove CSS</h1>
<br/><br/>
<input type="button" value="remove CSS" onclick="removeCSS()">
<input type="button" value="add CSS" onclick="addCSS()">
<input type="button" value="remove all CSS" onclick="removeAll()">
<input type="button" value="add style" onclick="addStyle()">
<br/><br/>
<div id="divCSSID" class="black xxx yyy zzz">
    Dies ist Text in einem div-tag.
</div>
<script>
    'use strict';
    function getURL(){
        document.querySelector('#ausgabenID').value = document.URL;
    }
    function getFileName(){
        let path = document.URL;
        let page = path.split("/").pop();
        document.querySelector('#ausgabenID').value = page;
    }

    function getDomain(){
        document.querySelector('#ausgabenID').value = document.domain;
    }

    function getImageInfo(){
        document.querySelector('#ausgabenID').value =
            'Pfad vom Quietsche-Entchen: ' + document.images[0].src
            + '================> Anzahl Bilder: ' + document.images.length;
    }

    function getLinks(){
        document.querySelector('#ausgabenID').value = "Anzahl Links: "
            + document.links.length
            +'; Link 1: ' + document.links.item(0)
            +'; Link 2: ' + document.links.item(1);
        console.log(document.links.item(0));
        console.log(document.links.item(1));
        console.log(document.links[0]);
        console.log(document.links[1]);
    }

    let slider = document.getElementById("myRange");
    let output = document.getElementById("ausgabenID");
    output.value = slider.value;

    slider.oninput = function() {
        output.value = this.value;
    }


    function getName(){
        let output = document.getElementById("output"); //= document.getElementsByName("fname")[0].value;
        output.innerText = document.getElementsByName("fname")[0].value + ' '
            + document.getElementsByName("lname")[0].value;
    }

    document.querySelector('#checkboxId').addEventListener('click',setTrue);
    function setTrue(){

        let val = document.getElementsByName("Lecker");
        val.forEach(function (item, index, arr){
            arr[index].checked = true;
        });
    }

    document.querySelector('#checkboxId2').addEventListener('click',setFalse);
    function setFalse(){
        let val = document.getElementsByName("Lecker");
        val.forEach(function (item, index, arr){
            arr[index].checked = false;
        });
    }

    document.querySelector('#getClassId').addEventListener('click', getClass);
    function getClass(){
        let elem = document.getElementsByClassName('divClass');
        let ausgabe = 'Anzahl: ' + elem.length + '<br/>In den div\'s steht folgender Text:<ul>';
        for(let i = 0; i<elem.length; i++) {
            ausgabe += '<li>' + elem[i].innerHTML + '</li>';
        }
        document.querySelector('.divClass').innerHTML = ausgabe + '</ul>';
    }

    document.querySelector('#attributeId').addEventListener('click', getAttr);
    function getAttr(){
        const div = document.getElementById('divId');
        let ausgabe = 'datenAttribut: ' + div.getAttribute('datenAttribut') + '<br/>';
        ausgabe += 'attr: ' + div.getAttribute('attr') + '<br/>';
        ausgabe += 'grmpf: ' + div.getAttribute('grmpf') + '<br/>';

        document.querySelector('#divId').innerHTML = ausgabe;
    }

    document.querySelector('#cmdImgId').addEventListener('click', moveImage);

    let interval = null;
    let pos_x = 10;
    let pos_y = 250;
    function moveImage(){
        let img = document.getElementById('entcheImgID');
        img.style.position = 'absolute';
        interval = setInterval(function(){
            move(img);
        }, 10);
    }

    function move(img){
        img.style.left = pos_x + 'px'; //222px
        img.style.top = pos_y + 'px';
        pos_x = pos_x + 1;
        pos_y = pos_y + 1;

        if(pos_x > 500){
            clearInterval(interval);
        }
    }

    function createText(){
        let p = document.createElement('p');
        p.style = "font-size: 48px;"
        p.appendChild(document.createTextNode('Hallo, '));

        let span = document.createElement('span');
        span.style = "font-size:96px";
        span.appendChild(document.createTextNode('Welt'));

        let attention = document.createTextNode('!!!!');
        span.appendChild(attention);

        span.innerHTML = span.innerHTML  + " Wie geht es???";

        p.appendChild(span);

        document.getElementById('newElementsID').appendChild(p);
    }


    function newList(){
        const liste = document.getElementById("listDivId");

        const ul = document.createElement('ul');
        const li = document.createElement('li');
        li.textContent = "Hallo";
        const li1 = document.createElement('li');
        li1.textContent = "Welt";
        const li2 = document.createElement('li');
        li2.textContent = "Wie geht es Euch?";
        const li3 = document.createElement('li');
        li3.textContent = "Macht JavaScript noch Spaß?";

        ul.appendChild(li);
        ul.appendChild(li1);
        ul.appendChild(li2);
        ul.appendChild(li3);

        liste.appendChild(ul);
    }

    function newImage(){
        let img = document.createElement ("img"); // new Image()
        // let img = new Image();
        img.height = 150;
        img.title = 'neues Bild'
        img.src = "../../../_images/site/resize.png";
        const ID = Math.floor(Math.random() * (100000000 - 1)) + 1;;
        img.id = ID;

        let lineBreak = document.createElement('br');

        document.querySelector("#imageId").appendChild(img);
        document.getElementById(ID).after(lineBreak);
    }

    function createImg(){
        let elems = [
            '../../../_images/site/ei.png',
            '../../../_images/site/Smiley.png',
            '../../../_images/site/arrow_up.png',
            '../../../_images/site/quitsche_entchen.jpg',
        ];
        let fragment = document.createDocumentFragment();

        for (let i=0; i<elems.length; i++) {
            let newNode = document.createElement('img');
            newNode.setAttribute('src', elems[i]);
            fragment.appendChild(newNode);
        }

        document.querySelector('#targetID').appendChild(fragment);
    }


    function remove(ID){
        //identifizieren des Knotens
        let element = document.getElementById(ID);
        //Aufrufen des Elternknotens
        element.parentNode.removeChild(element)
    }

    function removeCSS(){
        const el = document.querySelector('#divCSSID');
        if (el.classList.contains("black")) {
            el.classList.remove("black");
        }
    }

    function addCSS(){
        const el = document.querySelector('#divCSSID');
        el.classList.add("red");
    }

    function removeAll(){
        document.querySelector('#divCSSID').className = '';
    }

    function addStyle(){
        document.querySelector('#divCSSID').style = 'font-size:46px; background-color: #0f0;color:red';
    }

</script>
</body>
</html>
